name: Snowflake Client - Dev Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Snowflake Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Find JAR files
        run: ls -lah build/libs/

      - name: Create Snapshot Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: snapshot
          name: Snowflake Client - Snapshot
          prerelease: true
          make_latest: false
          files: |
            build/libs/*.jar
            
